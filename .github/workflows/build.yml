name: Build DirtRush APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Estrai DirtRush.zip
        run: |
          unzip -o DirtRush.zip -d .
          ls -la
          ls -la DirtRush/

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Genera gradlew e compila
        working-directory: DirtRush
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: DirtRush-APK
          path: DirtRush/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
